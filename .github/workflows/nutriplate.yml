name: NutriPlate CI

on:
  push:
    paths: ['nutriplate/**', '.github/workflows/nutriplate.yml']
  pull_request:
    paths: ['nutriplate/**', '.github/workflows/nutriplate.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nutriplate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nutriplate/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
