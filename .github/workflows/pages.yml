name: Deploy GitHub Pages

# Déploie :
#   /                      -> Méthode des J (site statique à la racine du repo)
#   /nutriplate/           -> NutriPlate (build Vite)
# Activation : Settings -> Pages -> Source : "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nutriplate/package-lock.json
      - name: Build NutriPlate
        working-directory: nutriplate
        env:
          VITE_BASE: /${{ github.event.repository.name }}/nutriplate/
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site/nutriplate
          cp -r index.html app.js style.css sw.js manifest.webmanifest icons _site/
          cp -r nutriplate/dist/. _site/nutriplate/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
